name: triage

# Adds new issues and pull requests to the project board.
#
# Disabled until PROJECT_URL is set, because a workflow that fails on every
# issue is worse than no workflow. To switch it on, create the project, then
# set the repository variable:
#
#   Settings, Secrets and variables, Actions, Variables, New
#   name  PROJECT_URL
#   value https://github.com/users/itu-itis25-bektes23/projects/N
#
# The token needs project scope, so a classic PAT stored as ADD_TO_PROJECT_PAT
# is required. The default GITHUB_TOKEN cannot write to user-level projects.

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

# Least privilege at the top, widened per job only where a job needs more.
# Without this the workflow inherits the repository default, which can be
# write-all. Scorecard's Token-Permissions check flags exactly that.
permissions:
  contents: read

jobs:
  add:
    if: vars.PROJECT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
