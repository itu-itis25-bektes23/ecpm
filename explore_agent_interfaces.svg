<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrowE" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#333"/></marker>
</defs>
<rect x="0" y="0" width="820" height="620" fill="#ffffff"/>

<!-- North: run_pilot.py -->
<rect x="330" y="30" width="160" height="64" rx="5" fill="#eef2f7" stroke="#8fa4bb" stroke-width="1.1"/>
<text x="410" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#16232f">Pilot Driver</text>
<text x="410" y="74" text-anchor="middle" font-size="10.5" fill="#3d5165">run_pilot.py</text>

<!-- West: ecpm_parser.py -->
<rect x="30" y="278" width="160" height="64" rx="5" fill="#eef2f7" stroke="#8fa4bb" stroke-width="1.1"/>
<text x="110" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#16232f">Parser &amp; Scorer</text>
<text x="110" y="322" text-anchor="middle" font-size="10.5" fill="#3d5165">ecpm_parser.py</text>

<!-- Center: explore_agent.py (emphasized) -->
<rect x="320" y="272" width="180" height="76" rx="6" fill="#eaf3ec" stroke="#5a9c72" stroke-width="1.6"/>
<text x="410" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#173c22">Explore Agent</text>
<text x="410" y="327" text-anchor="middle" font-size="10.5" fill="#2f5c3d">explore_agent.py</text>

<!-- East: resource_mdp.py -->
<rect x="630" y="278" width="160" height="64" rx="5" fill="#eef2f7" stroke="#8fa4bb" stroke-width="1.1"/>
<text x="710" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#16232f">Environment</text>
<text x="710" y="322" text-anchor="middle" font-size="10.5" fill="#3d5165">resource_mdp.py</text>

<!-- South: explore_metrics.py -->
<rect x="330" y="526" width="160" height="64" rx="5" fill="#eef2f7" stroke="#8fa4bb" stroke-width="1.1"/>
<text x="410" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#16232f">Metrics</text>
<text x="410" y="570" text-anchor="middle" font-size="10.5" fill="#3d5165">explore_metrics.py</text>

<!-- North -> Center: call -->
<line x1="380" y1="94" x2="380" y2="272" stroke="#333" stroke-width="1.5" marker-end="url(#arrowE)"/>
<text x="365" y="178" text-anchor="end" font-size="11" fill="#1c1c1c">run_explore_instance</text>
<text x="365" y="192" text-anchor="end" font-size="11" fill="#1c1c1c">(inst, cfg, act_fn)</text>

<!-- Center -> North: callback return (dashed) -->
<line x1="440" y1="272" x2="440" y2="94" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowE)"/>
<text x="455" y="192" text-anchor="start" font-size="11" fill="#1c1c1c">act_fn(system, messages)</text>
<text x="455" y="206" text-anchor="start" font-size="11" fill="#1c1c1c">-&gt; (raw_text, reasoning)</text>

<!-- Center -> East -->
<line x1="500" y1="300" x2="630" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrowE)"/>
<text x="565" y="292" text-anchor="middle" font-size="10.5" fill="#1c1c1c">resource_mdp API</text>

<!-- Center -> West: import, reference only (dotted) -->
<line x1="320" y1="300" x2="190" y2="300" stroke="#777" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arrowE)"/>
<text x="255" y="292" text-anchor="middle" font-size="10.5" fill="#555">extract_json_object</text>

<!-- Center -> South: data flow -->
<line x1="410" y1="348" x2="410" y2="526" stroke="#333" stroke-width="1.5" marker-end="url(#arrowE)"/>
<text x="410" y="424" text-anchor="middle" font-size="11" fill="#1c1c1c">EpisodeOutcome / LiveStep</text>
<text x="410" y="440" text-anchor="middle" font-size="11" fill="#1c1c1c">-&gt; compute_explore_metrics()</text>

<!-- Legend -->
<line x1="20" y1="562" x2="55" y2="562" stroke="#333" stroke-width="1.5" marker-end="url(#arrowE)"/>
<text x="62" y="566" font-size="10.5" fill="#333">function call</text>
<line x1="20" y1="580" x2="55" y2="580" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowE)"/>
<text x="62" y="584" font-size="10.5" fill="#333">return value</text>
<line x1="20" y1="598" x2="55" y2="598" stroke="#777" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arrowE)"/>
<text x="62" y="602" font-size="10.5" fill="#555">import (reference only, unused for parsing)</text>
</svg>
